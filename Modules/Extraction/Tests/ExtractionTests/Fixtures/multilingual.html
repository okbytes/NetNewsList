<body><article>
<h1>京都の秋</h1>
<p>十一月の京都は紅葉が見ごろで、朝早くから多くの人が寺を訪れていました。嵐山では川沿いの道がとても美しく、写真を撮る人がたくさんいました。🍁</p>
<p>午後は哲学の道を歩き、小さな喫茶店で抹茶と和菓子を楽しみました。静かな時間が流れていて、旅の疲れもすっかり忘れてしまいました。</p>
<p>夜は祇園を散歩して、石畳の路地に灯る提灯の明かりを眺めました。次の旅では、もっとゆっくり時間をかけて回りたいと思います。</p>
